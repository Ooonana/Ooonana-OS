[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openvino-chat"
version = "0.2.1"
description = "Local OpenVINO chat and coding agent CLI"
requires-python = ">=3.12"
dependencies = [
  "huggingface_hub",
  "imageio[ffmpeg]",
  "numpy",
  "openvino-genai",
  "pillow",
  "prompt_toolkit",
  "rich",
  "soundfile",
  "psutil",
  "pywebview>=6; sys_platform == 'win32'",
  "pywinauto>=0.6.8; sys_platform == 'win32'",
]

[project.scripts]
openvino = "openvino_chat.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openvino_chat = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
