[build-system]
requires = ["setuptools>=82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openvino-chat"
version = "0.1.1"
description = "Local OpenVINO chat and coding agent CLI"
requires-python = ">=3.12"
dependencies = [
  "huggingface_hub",
  "openvino-genai",
  "prompt_toolkit",
  "rich",
]

[project.scripts]
openvino = "openvino_chat.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
