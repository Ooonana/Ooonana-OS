# Called after the classic menu and all boot entries are ready.
if [ "$ooonana_classic_menu" = 1 ]; then
  set timeout=-1
elif [ "$ooonana_gfx_ready" = 1 ]; then
  set ooonana_ui=/boot/grub/grub-ui
  set ooonana_ui_ready=1
  for asset in theme.txt backdrop.png panel.png brand.png heading.png divider.png controls.png item_c.png selection_c.png menu.pf2 menu-selected.pf2 status.pf2; do
    if [ ! -f "$ooonana_ui/$asset" ]; then
      set ooonana_ui_ready=0
    fi
  done
  if [ "$ooonana_ui_ready" = 1 ]; then
    if insmod png; then
      if insmod gfxmenu; then
        if loadfont "$ooonana_ui/menu.pf2" "$ooonana_ui/menu-selected.pf2" "$ooonana_ui/status.pf2"; then
          set theme="$ooonana_ui/theme.txt"
          set icondir="$ooonana_ui/icons"
          export theme
          export icondir

          menuentry 'Classic menu' --class=ooonana-classic --hotkey=l {
            set ooonana_classic_menu=1
            export ooonana_classic_menu
            configfile /boot/grub/grub.cfg
          }
        fi
      fi
    fi
  fi
fi
